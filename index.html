<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng phân công công việc</title>

    <!-- Netlify Identity widget: xử lý đăng nhập (bao gồm nút "Log in with Google"
         một khi Google được bật làm External Provider trong Netlify dashboard). -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Bắt buộc để xử lý link xác nhận email / mời người dùng / quên mật khẩu
         khi Netlify Identity redirect về site kèm theo #invite_token, #recovery_token... -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/";
            });
          }
        });
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
